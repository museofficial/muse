name: Release snapshot of PR
on:
  workflow_run:
    workflows: ["Build snapshot of PR"]
    types:
      - completed

permissions: {}

env:
  REGISTRY_IMAGE: ghcr.io/museofficial/muse

jobs:
  validate:
    name: Validate snapshot origin
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
      pr_number: ${{ steps.snapshot.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The workflow_run workflow and this validator come from the default branch.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download SHA
        uses: actions/download-artifact@v8
        with:
          path: /tmp/snapshot-sha
          name: sha
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR number
        uses: actions/download-artifact@v8
        with:
          path: /tmp/snapshot-pr
          name: pull_request_number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate snapshot metadata
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/validate-pr-snapshot.mjs

  release-and-comment:
    name: Release snapshot and comment in PR
    needs: validate
    if: needs.validate.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: write
    env:
      SHA: ${{ needs.validate.outputs.sha }}
      PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          path: /tmp/images
          pattern: image-linux-*
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Load images
        run: |
          docker load -i /tmp/images/image-linux-amd64.tar
          docker load -i /tmp/images/image-linux-arm64.tar

      - name: Push images
        run: |
          docker push "${REGISTRY_IMAGE}:${SHA}-linux-amd64"
          docker push "${REGISTRY_IMAGE}:${SHA}-linux-arm64"

      - name: Create preview manifest
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:pr-${PR_NUMBER}" \
            "${REGISTRY_IMAGE}:${SHA}-linux-amd64" \
            "${REGISTRY_IMAGE}:${SHA}-linux-arm64"

      - name: Create comment
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: "pr-release"
          number: ${{ needs.validate.outputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            #### :package: :robot: A new release has been made for this pull request.

            To play around with this PR, pull `${{ env.REGISTRY_IMAGE }}:pr-${{ needs.validate.outputs.pr_number }}`.

            Images are available for x86_64 and ARM64.

            > Latest commit: ${{ needs.validate.outputs.sha }}
